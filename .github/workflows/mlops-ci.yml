name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov fastapi httpx pandera pandas feast mlflow scikit-learn requests pydantic pydantic-settings sqlalchemy psycopg2-binary

    - name: Run All MLOps Tests
      run: |
        pytest tests/ -v --cov=src --cov=app

  build-and-push:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker API Image
      run: docker build -t car_acc_fastapi_serving -f Dockerfile.api .

    - name: Simulated Push to Registry
      run: echo "Image pushed to Registry (Simulated)"
