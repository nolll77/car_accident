name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov fastapi httpx pandera pandas feast mlflow scikit-learn

    - name: Run MLOps Data Contract Tests
      run: |
        pytest tests/test_data_contracts.py -v --cov=src.data

    - name: Run Serving API Tests
      run: |
        pytest tests/test_api_serving.py -v --cov=app

  build-and-push:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker API Image
      run: docker build -t car_acc_fastapi_serving -f Dockerfile.api .

    - name: Simulated Push to Registry
      run: echo "Image pushed to Registry (Simulated)"
