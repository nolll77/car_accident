# Prefect Deployment Descriptor
# Référence : https://docs.prefect.io/concepts/deployments/
#
# Usage :
#   prefect deploy          # déploie via ce fichier
#   prefect worker start    # démarre un worker local

name: agentic-control-plane

deployments:
  - name: data-risk-sweep
    description: "Surveillance quotidienne des risques DATA-* sur le Control Plane Agentique."
    entrypoint: agentic/entrypoints/prefect_app.py:agentic_control_plane_flow
    parameters:
      risk_id: "DATA-042"
      detection_window: "daily"
    schedules:
      - cron: "0 8 * * *"     # Chaque jour à 08h00 UTC
        timezone: "Europe/Paris"
    work_pool:
      name: default-agent-pool
    pull:
      - prefect.deployments.steps.run_shell_script:
          script: pip install -r requirements.txt --quiet

  - name: webhook-trigger
    description: "Déclenchement à la demande (via webhook Prometheus/Evidently)."
    entrypoint: agentic/entrypoints/prefect_app.py:agentic_control_plane_flow
    work_pool:
      name: default-agent-pool
