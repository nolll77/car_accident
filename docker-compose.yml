version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_password
      POSTGRES_DB: mlops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialisation of bucket
  minio-init:
    image: minio/mc:RELEASE.2023-11-20T16-30-59Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc rm -r --force myminio/mlflow;
      /usr/bin/mc mb myminio/mlflow;
      /usr/bin/mc anonymous set public myminio/mlflow;
      exit 0;
      "

  mlflow:
    image: python:3.10-slim
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadminpassword
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      /bin/sh -c "pip install mlflow==3.15.1 psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri postgresql://mlops:mlops_password@db:5432/mlops_db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'"
    ports:
      - "5001:5000"

  mlflow-serve:
    image: python:3.10-slim
    depends_on:
      - mlflow
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadminpassword
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: >
      /bin/sh -c "pip install mlflow==3.15.1 psycopg2-binary boto3 scikit-learn pandas numpy &&
      mlflow models serve -m 'models:/BAAC_Model_Famille_A/latest' --env-manager local --host 0.0.0.0 --port 5002"
    ports:
      - "5002:5002"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Lecture des métriques drift écrites par le job batch Evidently
      - ./reports/drift:/drift_metrics:ro

  # Pushgateway — reçoit les métriques push des jobs batch (Evidently drift)
  pushgateway:
    image: prom/pushgateway:v1.6.2
    ports:
      - "9091:9091"

  fastapi-serving:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FEAST_REDIS_HOST=redis
      - FEAST_POSTGRES_HOST=db
    depends_on:
      - mlflow
      - redis
      - db

  superset:
    image: apache/superset:3.0.0
    environment:
      - SUPERSET_SECRET_KEY=mlops_baac_secret_key_12345
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./superset-init.sh:/app/superset-init.sh
      - ./superset_config:/app/superset_config
    user: "root"
    entrypoint: ["/bin/bash", "/app/superset-init.sh"]

volumes:
  pgdata:
  miniodata:
